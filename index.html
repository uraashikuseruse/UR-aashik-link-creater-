<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#6366f1">
    <meta name="description" content="Create shareable links for your ZIP files instantly">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Link Creator">
    <meta name="application-name" content="UR AASHIK LINK CREATER">
    <title>UR AASHIK LINK CREATER</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%236366f1' width='192' height='192'/><text x='50%' y='50%' font-size='120' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='middle'>✨</text></svg>" sizes="192x192">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%236366f1' width='180' height='180'/><text x='90' y='90' font-size='110' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='middle'>✨</text></svg>">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --accent: #ec4899;
            --success: #10b981;
            --bg-dark: #0f172a;
            --bg-light: #f8fafc;
            --card: #1e293b;
            --border: #334155;
            --text: #f1f5f9;
            --text-muted: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #1a1f3a 100%);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .background-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .gradient-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.1;
            animation: float 15s ease-in-out infinite;
        }

        .circle-1 {
            width: 400px;
            height: 400px;
            background: var(--primary);
            top: -200px;
            left: -200px;
            animation-delay: 0s;
        }

        .circle-2 {
            width: 300px;
            height: 300px;
            background: var(--accent);
            bottom: -150px;
            right: -150px;
            animation-delay: 5s;
        }

        .circle-3 {
            width: 350px;
            height: 350px;
            background: var(--success);
            top: 50%;
            right: -175px;
            animation-delay: 10s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(50px, -50px); }
            50% { transform: translate(-50px, 50px); }
            75% { transform: translate(30px, 30px); }
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
            animation: slideDown 0.8s ease-out;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 15px;
            animation: pulse 2s ease-in-out infinite;
        }

        h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            font-weight: 300;
        }

        .upload-section {
            background: rgba(30, 41, 59, 0.8);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 40px;
            backdrop-filter: blur(10px);
            animation: slideUp 0.8s ease-out;
            transition: all 0.3s ease;
        }

        .upload-section:hover {
            border-color: var(--primary);
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.2);
        }

        .upload-area {
            border: 3px dashed var(--border);
            border-radius: 15px;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .upload-area::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.1), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .upload-area.drag-over {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .upload-text {
            font-size: 1.2rem;
            color: var(--text);
            margin-bottom: 5px;
            font-weight: 600;
        }

        .upload-subtext {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        #fileInput {
            display: none;
        }

        .links-section {
            animation: slideUp 1s ease-out;
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 25px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .link-card {
            background: rgba(30, 41, 59, 0.8);
            border: 2px solid var(--border);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            transition: all 0.3s ease;
            animation: slideIn 0.5s ease-out;
        }

        .link-card:hover {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.15);
            transform: translateY(-2px);
        }

        .link-info {
            flex: 1;
            min-width: 0;
        }

        .link-name {
            font-weight: 600;
            margin-bottom: 8px;
            word-break: break-word;
            color: var(--primary);
        }

        .link-url {
            background: rgba(99, 102, 241, 0.1);
            padding: 10px 15px;
            border-radius: 8px;
            word-break: break-all;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-family: 'Courier New', monospace;
            max-height: 80px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) transparent;
        }

        .link-url::-webkit-scrollbar {
            width: 4px;
        }

        .link-url::-webkit-scrollbar-track {
            background: transparent;
        }

        .link-url::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 2px;
        }

        .link-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        button:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: var(--accent);
        }

        .btn-secondary:hover {
            background: #db2777;
        }

        .btn-danger {
            background: #ef4444;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-small {
            padding: 8px 15px;
            font-size: 0.8rem;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-text {
            font-size: 1.1rem;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--card);
            border: 2px solid var(--border);
            padding: 20px 25px;
            border-radius: 12px;
            color: var(--text);
            font-weight: 600;
            animation: slideInUp 0.4s ease-out;
            max-width: 300px;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .toast.success {
            border-color: var(--success);
            color: var(--success);
        }

        .toast.error {
            border-color: #ef4444;
            color: #ef4444;
        }

        @keyframes slideInUp {
            from {
                transform: translateY(100px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes slideDown {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes slideIn {
            from {
                transform: translateX(-30px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(30, 41, 59, 0.8);
            border: 2px solid var(--border);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
            animation: slideUp 0.8s ease-out;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .copy-btn {
            background: var(--success);
        }

        .copy-btn:hover {
            background: #059669;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }

            .upload-section {
                padding: 30px 20px;
            }

            .upload-area {
                padding: 40px 15px;
            }

            .link-card {
                flex-direction: column;
                align-items: flex-start;
            }

            .link-actions {
                width: 100%;
            }

            button {
                flex: 1;
                min-width: 100px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .toast {
                right: 20px;
                left: 20px;
                bottom: 20px;
            }
        }

        .feature-badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="background-animation">
        <div class="gradient-circle circle-1"></div>
        <div class="gradient-circle circle-2"></div>
        <div class="gradient-circle circle-3"></div>
    </div>

    <div class="container">
        <header>
            <div class="logo">✨</div>
            <h1>UR AASHIK LINK CREATER</h1>
            <p class="subtitle">Create shareable links for your ZIP files instantly</p>
            <div class="feature-badge">Live • Animated • Professional</div>
        </header>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalFiles">0</div>
                <div class="stat-label">Total Files</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalLinks">0</div>
                <div class="stat-label">Created Links</div>
            </div>
        </div>

        <div class="upload-section">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📦</div>
                <div class="upload-text">Click to upload or drag your ZIP file here</div>
                <div class="upload-subtext">Maximum file size: 100GB</div>
            </div>
            <input type="file" id="fileInput" accept=".zip">
        </div>

        <div class="links-section">
            <h2 class="section-title">📥 Your Created Links</h2>
            <div id="linksContainer">
                <div class="empty-state">
                    <div class="empty-icon">🎁</div>
                    <div class="empty-text">No links created yet. Upload a ZIP file to get started!</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize IndexedDB
        let db;
        const dbName = 'ZipLinksDB';
        const storeName = 'zipFiles';

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(dbName, 1);

                request.onerror = () => reject(request.error);
                request.onsuccess = () => {
                    db = request.result;
                    resolve(db);
                };

                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains(storeName)) {
                        db.createObjectStore(storeName, { keyPath: 'id' });
                    }
                };
            });
        }

        // File handling
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');

        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('drag-over');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('drag-over');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('drag-over');
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        function generateUniqueId() {
            return Math.random().toString(36).substr(2, 9);
        }

        async function handleFiles(files) {
            for (let file of files) {
                if (!file.name.endsWith('.zip')) {
                    showToast('Please upload only ZIP files', 'error');
                    continue;
                }

                if (file.size > 100 * 1024 * 1024 * 1024) {
                    showToast('File size exceeds 100GB limit', 'error');
                    continue;
                }

                const reader = new FileReader();
                reader.onload = async (e) => {
                    const linkId = generateUniqueId();
                    const shareUrl = `${window.location.origin}?download=${linkId}`;

                    const fileData = {
                        id: linkId,
                        name: file.name,
                        data: e.target.result,
                        url: shareUrl,
                        created: new Date().toLocaleString(),
                        size: file.size
                    };

                    try {
                        const transaction = db.transaction([storeName], 'readwrite');
                        const store = transaction.objectStore(storeName);
                        store.add(fileData);

                        transaction.oncomplete = () => {
                            showToast('Link created successfully!', 'success');
                            renderLinks();
                            fileInput.value = '';
                        };

                        transaction.onerror = () => {
                            showToast('Error creating link', 'error');
                        };
                    } catch (error) {
                        showToast('Error creating link', 'error');
                    }
                };

                reader.readAsArrayBuffer(file);
            }
        }

        function renderLinks() {
            const transaction = db.transaction([storeName], 'readonly');
            const store = transaction.objectStore(storeName);
            const getAllRequest = store.getAll();

            getAllRequest.onsuccess = () => {
                const files = getAllRequest.result;
                const container = document.getElementById('linksContainer');

                document.getElementById('totalFiles').textContent = files.length;
                document.getElementById('totalLinks').textContent = files.length;

                if (files.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">🎁</div>
                            <div class="empty-text">No links created yet. Upload a ZIP file to get started!</div>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = files.map(file => `
                    <div class="link-card">
                        <div class="link-info">
                            <div class="link-name">📄 ${file.name}</div>
                            <div class="link-url">${file.url}</div>
                        </div>
                        <div class="link-actions">
                            <button class="copy-btn btn-small" onclick="copyToClipboard('${file.url}')">
                                📋 Copy
                            </button>
                            <button class="btn-secondary btn-small" onclick="downloadFile('${file.id}')">
                                ⬇️ Download
                            </button>
                            <button class="btn-danger btn-small" onclick="deleteFile('${file.id}')">
                                🗑️ Delete
                            </button>
                        </div>
                    </div>
                `).join('');
            };
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast('Link copied to clipboard!', 'success');
            }).catch(() => {
                showToast('Failed to copy', 'error');
            });
        }

        function downloadFile(fileId) {
            const transaction = db.transaction([storeName], 'readonly');
            const store = transaction.objectStore(storeName);
            const request = store.get(fileId);

            request.onsuccess = () => {
                const file = request.result;
                if (file) {
                    const blob = new Blob([file.data], { type: 'application/zip' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = file.name;
                    a.click();
                    URL.revokeObjectURL(url);
                    showToast('Download started!', 'success');
                }
            };
        }

        function deleteFile(fileId) {
            if (confirm('Are you sure you want to delete this link?')) {
                const transaction = db.transaction([storeName], 'readwrite');
                const store = transaction.objectStore(storeName);
                store.delete(fileId);

                transaction.oncomplete = () => {
                    showToast('Link deleted successfully', 'success');
                    renderLinks();
                };
            }
        }

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        // Check for download parameter
        function checkDownloadRequest() {
            const params = new URLSearchParams(window.location.search);
            const downloadId = params.get('download');

            if (downloadId) {
                setTimeout(() => {
                    downloadFile(downloadId);
                    // Clean up URL
                    window.history.replaceState({}, document.title, window.location.pathname);
                }, 500);
            }
        }

        // Service Worker registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js', { scope: './' })
                    .then(registration => {
                        console.log('[PWA] Service Worker registered:', registration);
                        
                        // Check for updates
                        registration.addEventListener('updatefound', () => {
                            console.log('[PWA] New update found');
                        });
                    })
                    .catch(error => {
                        console.error('[PWA] Service Worker registration failed:', error);
                    });
            });
        }

        // Initialize app
        async function init() {
            await initDB();
            renderLinks();
            checkDownloadRequest();
        }

        init();
    </script>
</body>
</html>
